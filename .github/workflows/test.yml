name: Test

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create Python virtual env
        run: python -m venv .venv

      - name: Add venv to GITHUB_PATH
        run: |
          import os
          venv_bin = os.path.join(os.getcwd(), ".venv", "Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a") as f:
              f.write(f"{venv_bin}\n")
        shell: python

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.6"

      - name: Install Yarn dependencies
        run: yarn

      - name: TypeScript tests
        run: yarn test

      - name: Python tests
        run: python -m pytest

      - name: Rust tests
        run: cargo test

      - name: Java tests
        run: mvn test

      - name: CLI smoke tests
        run: yarn test:cli
